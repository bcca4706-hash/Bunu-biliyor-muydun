<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bunu Biliyor muydun?</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #06080F;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.08);
  --text: #EEF2FF;
  --text2: #5B6785;
  --accent: #6366F1;
  --accent2: #818CF8;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ── BG CANVAS ── */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── MAIN WRAP ── */
.wrap {
  position: relative; z-index: 1;
  width: 100%; height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 52px 24px 24px;
}

/* ── TOP ── */
.top-row {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
}

.app-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: 3px; color: var(--text2);
  text-transform: uppercase;
}

.counter-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px; font-weight: 700;
  color: var(--text2);
}

.counter-chip span { color: var(--accent2); }

/* ── CARD ── */
.card-wrap {
  flex: 1;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.fact-card {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 24px;
  padding: 32px 26px;
  display: flex; flex-direction: column; gap: 20px;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card-glow {
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
  pointer-events: none;
}

.fact-category {
  display: flex; align-items: center; gap: 8px;
}

.cat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent2);
}

.cat-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 2px; color: var(--accent2);
  text-transform: uppercase;
}

.fact-icon {
  font-size: 48px; line-height: 1;
  filter: drop-shadow(0 4px 16px rgba(99,102,241,0.3));
}

.fact-text {
  font-size: 19px; font-weight: 600;
  line-height: 1.55; color: var(--text);
  letter-spacing: -0.2px;
}

.fact-source {
  font-size: 11px; color: var(--text2);
  font-weight: 500;
}

/* Swipe hint */
.swipe-hint {
  position: absolute;
  bottom: -28px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; color: var(--text2);
  letter-spacing: 0.5px;
  white-space: nowrap;
  animation: hintFade 3s ease 2s forwards;
  opacity: 1;
}
@keyframes hintFade { to { opacity: 0; } }

/* ── PROGRESS DOTS ── */
.progress-dots {
  display: flex; gap: 5px; align-items: center;
}

.pdot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}
.pdot.active {
  background: var(--accent2);
  width: 18px;
  border-radius: 3px;
}
.pdot.seen { background: rgba(99,102,241,0.3); }

/* ── BOTTOM ── */
.bottom-area {
  width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  align-items: center;
}

.next-btn {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  border: none; border-radius: 16px;
  color: white;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
  box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.next-btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(99,102,241,0.2); }

.btn-row { width: 100%; display: flex; gap: 12px; align-items: stretch; }
.btn-row .next-btn { flex: 1 1 auto; width: auto; }
.back-btn {
  flex: 0 0 62px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s;
}
.back-btn:active { transform: scale(0.97); }
.back-btn:disabled { opacity: 0.28; cursor: default; }

/* ── AD BANNER ── */
.ad-wrap {
  width: 100%; position: relative;
  overflow: hidden;
}

.ad-bar {
  width: 100%; height: 52px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
}

.ad-label { font-size: 11px; color: var(--text2); }

.ad-timer {
  font-size: 10px; font-weight: 700;
  color: var(--accent2);
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 20px;
  padding: 3px 9px;
  min-width: 48px;
  text-align: center;
}

.ad-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), #8B5CF6);
  border-radius: 0 0 0 12px;
  transition: width 1s linear;
}

/* ── FINISH SCREEN ── */
#finishScreen {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 40px 32px;
  text-align: center;
}

.finish-icon { font-size: 64px; }

.finish-title {
  font-size: 32px; font-weight: 800;
  letter-spacing: -1.5px;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.finish-sub { font-size: 15px; color: var(--text2); line-height: 1.6; }

.finish-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 40px;
  display: flex; flex-direction: column; gap: 4px;
}

.finish-num {
  font-size: 48px; font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), #C4B5FD);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1;
}

.finish-lbl { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

.btn-restart {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--accent), #8B5CF6);
  border: none; border-radius: 16px;
  color: white; font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 800; cursor: pointer;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap" id="mainWrap">
  <div class="top-row">
    <div class="app-name">Bunu Biliyor muydun?</div>
    <div class="counter-chip">
      <span id="seenCount">0</span> / <span id="totalCount">—</span>
    </div>
  </div>

  <div class="card-wrap">
    <div class="fact-card" id="factCard">
      <div class="card-glow"></div>
      <div class="fact-category">
        <div class="cat-dot"></div>
        <div class="cat-label" id="catLabel">BİLİM</div>
      </div>
      <div class="fact-icon" id="factIcon">🔬</div>
      <div class="fact-text" id="factText">Yükleniyor...</div>
      <div class="fact-source" id="factSource">— Bilim</div>
    </div>
    <div class="swipe-hint">← önceki  ·  sonraki →</div>
  </div>

  <div class="progress-dots" id="progressDots"></div>

  <div class="bottom-area">
    <div class="btn-row">
      <button class="back-btn" id="backBtn" onclick="prevFact()" aria-label="Önceki bilgi">←</button>
      <button class="next-btn" onclick="nextFact()">Sonraki Bilgi →</button>
    </div>
  </div>
</div>

<!-- FİNİŞ -->
<div id="finishScreen">
  <div class="finish-icon">🧠</div>
  <div class="finish-title">Tebrikler!</div>
  <div class="finish-sub">100 bilginin tamamını gördün.<br>Yarın yeni bilgilerle tekrar gel.</div>
  <div class="finish-stat">
    <div class="finish-num">201</div>
    <div class="finish-lbl">Bilgi Öğrenildi</div>
  </div>
  <button class="btn-restart" onclick="restartAll()">🔄 Baştan Başla</button>
</div>

// ── UZAKTAN GUNCELLENEBILIR HAVUZ ──
// Yeni bilgi eklemek icin: github.io reponuza facts.json push edin.
// Play Store guncellemesi/incelemesi GEREKMEZ; kullanicida bir sonraki acilista taze bilgiler akar.
const REMOTE_FACTS_URL = "https://bcca4706-hash.github.io/facts.json";

// Gomulu havuz = orijinal + yeni eklenenler
const BUNDLED = FACTS.concat(FACTS_EXTRA);
let ALL = BUNDLED.slice();

// Kararli kimlik: metne dayali (havuz buyuyunce indeks kaymaz, yeni bilgiler dogal olarak taze akar)
function factId(f){
  const s = (f && f.text) ? f.text : '';
  let h = 0;
  for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return 'f' + (h >>> 0).toString(36);
}
function dedupe(list){
  const m = new Map();
  list.forEach(f => { if (f && f.text) m.set(factId(f), f); });
  return Array.from(m.values());
}

// ── STATE (kimlik bazli 'gorulen' takibi) ──
let seen = new Set(JSON.parse(localStorage.getItem('bbm_seen2') || '[]'));
let queue = [];
let current = null;

function saveSeen(){ try{ localStorage.setItem('bbm_seen2', JSON.stringify(Array.from(seen))); }catch(e){} }
function updateTotal(){ const el = document.getElementById('totalCount'); if (el) el.textContent = ALL.length; }

function buildQueue() {
  const unseen = ALL.filter(f => !seen.has(factId(f)));
  queue = unseen.sort(() => Math.random() - 0.5);
}

async function loadRemote(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 4000);
    const res = await fetch(REMOTE_FACTS_URL + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(t);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data.length){
      ALL = dedupe(BUNDLED.concat(data.filter(x => x && x.text)));
    }
  }catch(e){ /* internet yok / hata -> gomulu havuz kullanilir */ }
}

async function init() {
  ALL = dedupe(BUNDLED);
  updateTotal();
  buildQueue();
  if (queue.length === 0){ seen.clear(); saveSeen(); buildQueue(); }
  showNext();               // ilk bilgiyi hemen goster (gomulu havuzdan, bekletme yok)
  await loadRemote();       // arka planda taze bilgileri ekle
  updateTotal();
  buildQueue();             // kuyrugu tazele: gorulmeyenler + yeni gelen uzak bilgiler
}

function showToast(msg){
  let t = document.getElementById('bbmToast');
  if (!t){
    t = document.createElement('div');
    t.id = 'bbmToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(99,102,241,.95);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.opacity = '0'; }, 1800);
}

// ── GECMIS (ileri/geri gezinme) ──
let history = [];   // gosterilen bilgiler, sirayla
let histPos = -1;   // history icindeki mevcut konum

function updateBackBtn(){
  const b = document.getElementById('backBtn');
  if (b) b.disabled = (histPos <= 0);
}

function render(fact){
  if (!fact) return;
  current = fact;
  const card = document.getElementById('factCard');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = 'cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';

  document.getElementById('factIcon').textContent = fact.icon || '💡';
  document.getElementById('catLabel').textContent = fact.cat || 'BİLGİ';
  document.getElementById('factText').textContent = fact.text || '';
  document.getElementById('factSource').textContent = fact.source ? ('— ' + fact.source) : '';
  document.getElementById('seenCount').textContent = seen.size;

  renderDots();
  updateBackBtn();
}

// Kuyruktan yeni (daha once gorulmemis) bilgi cek; havuz bitince kesintisiz yeni tur
function pullNew(){
  if (queue.length === 0){
    seen.clear(); saveSeen();
    buildQueue();
    showToast('Yeni tur başladı 🔄');
  }
  const f = queue.shift();
  if (!f) return null;
  seen.add(factId(f));
  saveSeen();
  return f;
}

// true doner: gercekten YENI bir bilgi acildiysa (reklam sayaci icin)
function showNext(){
  if (histPos < history.length - 1){
    // gecmiste geri gitmistik -> ileri sar (yeni bilgi degil)
    histPos++;
    render(history[histPos]);
    return false;
  }
  const f = pullNew();
  if (!f) return false;
  history.push(f);
  if (history.length > 80){ history.shift(); } // gecmisi sinirla
  histPos = history.length - 1;
  render(f);
  return true;
}

function prevFact(){
  if (histPos > 0){
    histPos--;
    render(history[histPos]);
  }
}

function nextFact(){
  const wasNew = showNext();
  // Reklam sayaci yalniz YENI bilgi acilinca artar (geri/ileri gezinme reklam tetiklemez)
  if (wasNew){
    if (window.bbmAdCount === undefined) window.bbmAdCount = 0;
    window.bbmAdCount++;
    if (window.bbmAdCount % 6 === 0 && typeof window.bbmShowInterstitial === 'function'){
      window.bbmShowInterstitial();
    }
  }
}

function renderDots() {
  const wrap = document.getElementById('progressDots');
  if (!wrap) return;
  wrap.innerHTML = '';
  const total = 10;
  const denom = ALL.length || 1;
  const pos = Math.min(total - 1, Math.floor(((seen.size % denom) / denom) * total));
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < pos ? ' seen' : '') + (i === pos ? ' active' : '');
    wrap.appendChild(d);
  }
}

function restartAll() {
  seen.clear(); saveSeen();
  history = []; histPos = -1;
  const fs = document.getElementById('finishScreen');
  if (fs) fs.style.display = 'none';
  buildQueue();
  showNext();
}

// ── SWIPE ──
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -60) nextFact();       // sola kaydir -> sonraki
  else if (dx > 60) prevFact();   // saga kaydir -> onceki
}, { passive: true });

// ── BG PARTICLES ──
const bgC = document.getElementById('bg');
const bgX = bgC.getContext('2d');
bgC.width = window.innerWidth;
bgC.height = window.innerHeight;

const pts = Array.from({length:30}, () => ({
  x: Math.random()*bgC.width, y: Math.random()*bgC.height,
  vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
  r: Math.random()*1.2+.3, a: Math.random()*.15+.05
}));

function bgLoop() {
  bgX.clearRect(0,0,bgC.width,bgC.height);
  pts.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=bgC.width; if(p.x>bgC.width)p.x=0;
    if(p.y<0)p.y=bgC.height; if(p.y>bgC.height)p.y=0;
    bgX.beginPath();
    bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(99,102,241,${p.a})`;
    bgX.fill();
  });
  requestAnimationFrame(bgLoop);
}
bgLoop();

init();
</script>
<script>
(function(){
  // ===== AdMob Interstitial Kopru (temiz surum) =====
  // TEST icin: asagidaki TEST_MODE=true yap -> Google test reklami cikar (no-fill olmaz)
  // Reklam cikiyorsa kod dogru, sorun prod reklam biriminin dolmamasidir.
  var TEST_MODE = false;
  var PROD_AD_ID = 'ca-app-pub-2288995098594728/4291037717';
  var TEST_AD_ID = 'ca-app-pub-3940256099942544/1033173712'; // Google resmi test interstitial
  var AD_ID = TEST_MODE ? TEST_AD_ID : PROD_AD_ID;

  var P=null, ready=false, loading=false;

  function log(m){ try{ console.log('[BBM-AD] '+m); }catch(e){} }

  function preload(){
    if(!P || ready || loading) return;
    loading=true;
    log('preload basladi');
    P.prepareInterstitial({ adId: AD_ID })
      .then(function(){ ready=true; loading=false; log('reklam HAZIR'); })
      .catch(function(e){ loading=false; log('preload hata: '+(e&&e.message||e)); });
  }

  window.bbmShowInterstitial = function(){
    if(!P){ log('plugin yok'); return; }
    if(!ready){ log('reklam hazir degil, preload ediliyor'); preload(); return; }
    ready=false;
    log('reklam gosteriliyor');
    P.showInterstitial()
      .then(function(){ log('reklam gosterildi'); })
      .catch(function(e){ log('goster hata: '+(e&&e.message||e)); })
      .then(function(){ setTimeout(preload, 1500); }); // sonraki reklami yukle
  };

  function boot(){
    try{ P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob; }
    catch(e){ log('Capacitor/AdMob yok'); return; }
    if(!P){ log('AdMob plugin bulunamadi'); return; }
    log('AdMob plugin bulundu, initialize');
    P.initialize({ initializeForTesting: TEST_MODE })
      .then(function(){ log('initialize OK'); preload(); })
      .catch(function(e){ log('initialize hata: '+(e&&e.message||e)); preload(); });
  }

  if(document.readyState === 'complete') setTimeout(boot, 400);
  else window.addEventListener('load', function(){ setTimeout(boot, 400); });
})();
</script>
