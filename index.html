<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bunu Biliyor muydun?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #06080F;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.08);
  --text: #EEF2FF;
  --text2: #5B6785;
  --accent: #6366F1;
  --accent2: #818CF8;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ── BG CANVAS ── */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── MAIN WRAP ── */
.wrap {
  position: relative; z-index: 1;
  width: 100%; height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 52px 24px 24px;
}

/* ── TOP ── */
.top-row {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
}

.app-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: 3px; color: var(--text2);
  text-transform: uppercase;
}

.counter-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px; font-weight: 700;
  color: var(--text2);
}

.counter-chip span { color: var(--accent2); }

/* ── CARD ── */
.card-wrap {
  flex: 1;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.fact-card {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 24px;
  padding: 32px 26px;
  display: flex; flex-direction: column; gap: 20px;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card-glow {
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
  pointer-events: none;
}

.fact-category {
  display: flex; align-items: center; gap: 8px;
}

.cat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent2);
}

.cat-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 2px; color: var(--accent2);
  text-transform: uppercase;
}

.fact-icon {
  font-size: 48px; line-height: 1;
  filter: drop-shadow(0 4px 16px rgba(99,102,241,0.3));
}

.fact-text {
  font-size: 19px; font-weight: 600;
  line-height: 1.55; color: var(--text);
  letter-spacing: -0.2px;
}

.fact-source {
  font-size: 11px; color: var(--text2);
  font-weight: 500;
}

/* Swipe hint */
.swipe-hint {
  position: absolute;
  bottom: -28px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px; color: var(--text2);
  letter-spacing: 0.5px;
  white-space: nowrap;
  animation: hintFade 3s ease 2s forwards;
  opacity: 1;
}
@keyframes hintFade { to { opacity: 0; } }

/* ── PROGRESS DOTS ── */
.progress-dots {
  display: flex; gap: 5px; align-items: center;
}

.pdot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}
.pdot.active {
  background: var(--accent2);
  width: 18px;
  border-radius: 3px;
}
.pdot.seen { background: rgba(99,102,241,0.3); }

/* ── BOTTOM ── */
.bottom-area {
  width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  align-items: center;
}

.next-btn {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
  border: none; border-radius: 16px;
  color: white;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
  box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.next-btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(99,102,241,0.2); }

/* ── AD BANNER ── */
.ad-wrap {
  width: 100%; position: relative;
  overflow: hidden;
}

.ad-bar {
  width: 100%; height: 52px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
}

.ad-label { font-size: 11px; color: var(--text2); }

.ad-timer {
  font-size: 10px; font-weight: 700;
  color: var(--accent2);
  background: rgba(99,102,241,0.1);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 20px;
  padding: 3px 9px;
  min-width: 48px;
  text-align: center;
}

.ad-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), #8B5CF6);
  border-radius: 0 0 0 12px;
  transition: width 1s linear;
}

/* ── FINISH SCREEN ── */
#finishScreen {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 40px 32px;
  text-align: center;
}

.finish-icon { font-size: 64px; }

.finish-title {
  font-size: 32px; font-weight: 800;
  letter-spacing: -1.5px;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.finish-sub { font-size: 15px; color: var(--text2); line-height: 1.6; }

.finish-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 40px;
  display: flex; flex-direction: column; gap: 4px;
}

.finish-num {
  font-size: 48px; font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), #C4B5FD);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1;
}

.finish-lbl { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

.btn-restart {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--accent), #8B5CF6);
  border: none; border-radius: 16px;
  color: white; font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 800; cursor: pointer;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap" id="mainWrap">
  <div class="top-row">
    <div class="app-name">Bunu Biliyor muydun?</div>
    <div class="counter-chip">
      <span id="seenCount">1</span> / 100
    </div>
  </div>

  <div class="card-wrap">
    <div class="fact-card" id="factCard">
      <div class="card-glow"></div>
      <div class="fact-category">
        <div class="cat-dot"></div>

      </div>
      <div class="fact-icon" id="factIcon">🔬</div>
      <div class="fact-text" id="factText">Yükleniyor...</div>
      <div class="fact-source" id="factSource">— Bilim</div>
    </div>
    <div class="swipe-hint">← Sola kaydır · Sağa kaydır →</div>
  </div>

  <div class="progress-dots" id="progressDots"></div>

  <div class="bottom-area">
    <button class="next-btn" onclick="nextFact()">
      Sonraki Bilgi →
    </button>

    <div class="ad-wrap" id="adWrap">
      <div class="ad-bar">
        <div class="ad-label">📢 Reklam Alanı · AdMob</div>
        <div class="ad-timer" id="adTimer">3 sn</div>
      </div>
      <div class="ad-progress" id="adProgress" style="width:100%"></div>
    </div>
  </div>
</div>

<!-- FİNİŞ -->
<div id="finishScreen">
  <div class="finish-icon">🧠</div>
  <div class="finish-title">Tebrikler!</div>
  <div class="finish-sub">100 bilginin tamamını gördün.<br>Yarın yeni bilgilerle tekrar gel.</div>
  <div class="finish-stat">
    <div class="finish-num">100</div>
    <div class="finish-lbl">Bilgi Öğrenildi</div>
  </div>
  <button class="btn-restart" onclick="restartAll()">🔄 Baştan Başla</button>
</div>

// ── STATE ──
let seen = JSON.parse(localStorage.getItem('bbm_seen') || '[]');
let queue = [];
let current = null;
let adInterval = null;
let adSecondsLeft = 3;

function buildQueue() {
  const unseenIndices = FACTS.map((_,i)=>i).filter(i => !seen.includes(i));
  queue = unseenIndices.sort(() => Math.random() - 0.5);
}

function init() {
  buildQueue();
  if (queue.length === 0) {
    showFinish(); return;
  }
  showNext();
  renderDots();
  startAdTimer();
}

function showNext() {
  if (queue.length === 0) { showFinish(); return; }
  const idx = queue.shift();
  seen.push(idx);
  localStorage.setItem('bbm_seen', JSON.stringify(seen));
  current = FACTS[idx];

  const card = document.getElementById('factCard');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = 'cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';

  document.getElementById('factIcon').textContent = current.icon;
  document.getElementById('catLabel').textContent = current.cat;
  document.getElementById('factText').textContent = current.text;
  document.getElementById('factSource').textContent = `— ${current.source}`;
  document.getElementById('seenCount').textContent = seen.length;

  renderDots();
}

function nextFact() {
  showNext();
  resetAdTimer();
}

function renderDots() {
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  const total = Math.min(FACTS.length, 10);
  const pos = Math.floor((seen.length / FACTS.length) * 10);
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < pos ? ' seen' : '') + (i === pos ? ' active' : '');
    wrap.appendChild(d);
  }
}

function showFinish() {
  document.getElementById('finishScreen').style.display = 'flex';
}

function restartAll() {
  seen = [];
  localStorage.removeItem('bbm_seen');
  document.getElementById('finishScreen').style.display = 'none';
  init();
}

// ── AD TIMER ──
function startAdTimer() {
  adSecondsLeft = 3;
  updateAdUI();
  adInterval = setInterval(() => {
    adSecondsLeft--;
    updateAdUI();
    if (adSecondsLeft <= 0) {
      clearInterval(adInterval);
      const wrap = document.getElementById('adWrap');
      wrap.style.transition = 'opacity 0.4s, max-height 0.4s';
      wrap.style.opacity = '0';
      wrap.style.maxHeight = '0';
      wrap.style.overflow = 'hidden';
    }
  }, 1000);
}

function resetAdTimer() {
  clearInterval(adInterval);
  const wrap = document.getElementById('adWrap');
  wrap.style.opacity = '1';
  wrap.style.maxHeight = '';
  wrap.style.overflow = '';
  startAdTimer();
}

function updateAdUI() {
  document.getElementById('adTimer').textContent = adSecondsLeft > 0 ? `${adSecondsLeft} sn` : 'Kapandı';
  const pct = (adSecondsLeft / 3) * 100;
  document.getElementById('adProgress').style.width = `${pct}%`;
}

// ── SWIPE ──
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) nextFact();
}, { passive: true });

// ── BG PARTICLES ──
const bgC = document.getElementById('bg');
const bgX = bgC.getContext('2d');
bgC.width = window.innerWidth;
bgC.height = window.innerHeight;

const pts = Array.from({length:30}, () => ({
  x: Math.random()*bgC.width, y: Math.random()*bgC.height,
  vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
  r: Math.random()*1.2+.3, a: Math.random()*.15+.05
}));

function bgLoop() {
  bgX.clearRect(0,0,bgC.width,bgC.height);
  pts.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=bgC.width; if(p.x>bgC.width)p.x=0;
    if(p.y<0)p.y=bgC.height; if(p.y>bgC.height)p.y=0;
    bgX.beginPath();
    bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(99,102,241,${p.a})`;
    bgX.fill();
  });
  requestAnimationFrame(bgLoop);
}
bgLoop();

init();
</script>
